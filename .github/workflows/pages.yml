name: Publish public WebXR viewer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout verified application
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      # Deploy only the isolated public application. Workspace, API, source,
      # private catalogs and other sector resources never enter this artifact.
      - name: Verify selected public viewer and resource hashes
        run: node tooling/deploy/verify-public.cjs
      - name: Prepare bounded public artifact
        run: node tooling/deploy/prepare-pages.cjs
      - name: Upload static viewer
        uses: actions/upload-pages-artifact@v4
        with:
          path: data/pages-site

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: package
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public viewer
        id: deployment
        uses: actions/deploy-pages@v4
